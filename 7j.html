<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function convertTemperature(degrees, fromUnit, toUnit) {
  fromUnit = fromUnit.toUpperCase();
  toUnit = toUnit.toUpperCase();

  let result;

  if (fromUnit === 'C' && toUnit === 'F') {
    result = (degrees * 9 / 5) + 32;
  } else if (fromUnit === 'F' && toUnit === 'C') {
    result = (degrees - 32) * 5 / 9;
  } else if (fromUnit === 'C' && toUnit === 'K') {
    result = degrees + 273.15;
  } else if (fromUnit === 'K' && toUnit === 'C') {
    result = degrees - 273.15;
  } else if (fromUnit === 'F' && toUnit === 'K') {
    result = ((degrees - 32) * 5 / 9) + 273.15;
  } else if (fromUnit === 'K' && toUnit === 'F') {
    result = ((degrees - 273.15) * 9 / 5) + 32;
  } else if (fromUnit === toUnit) {
    result = degrees;
  } else {
    return "Invalid units. Use 'C', 'F', or 'K'.";
  }

  return `${result.toFixed(2)}${toUnit}`;
}

// Examples:
console.log(convertTemperature(25, 'C', 'F')); 
console.log(convertTemperature(86, 'F', 'C')); 
console.log(convertTemperature(0, 'C', 'K'));  
console.log(convertTemperature(300, 'K', 'C')); 
console.log(convertTemperature(100, 'K', 'F')); 

    </script>
</body>
</html>
